<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">LexiFlow 产品案例视觉</title>
  <desc id="desc">本地优先英语词汇学习桌面应用的界面与学习流程示意。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7f3"/>
      <stop offset="1" stop-color="#f1f0ec"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1">
      <stop stop-color="#dff4f6"/>
      <stop offset="1" stop-color="#edf8f4"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" x2="1">
      <stop stop-color="#fde8e3"/>
      <stop offset="1" stop-color="#f7edf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#22211f" flood-opacity=".12"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="44"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1310" cy="120" r="190" fill="#dff4f6" opacity=".58" filter="url(#soft)"/>
  <circle cx="210" cy="790" r="210" fill="#f7dcd7" opacity=".42" filter="url(#soft)"/>

  <g font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
    <text x="74" y="86" font-size="18" font-weight="800" letter-spacing="5" fill="#2f9fb6">LEXIFLOW / PRODUCT VIEW</text>
    <text x="74" y="126" font-size="14" fill="#6d6860">LOCAL-FIRST · AI COACH · WINDOWS</text>

    <g transform="translate(82 184)">
      <rect width="316" height="82" rx="18" fill="#fffaf1" stroke="#22211f" stroke-opacity=".09"/>
      <circle cx="42" cy="41" r="22" fill="#dff4f6"/>
      <path d="M31 44c10-15 22-15 32 0M34 51h26" fill="none" stroke="#2f9fb6" stroke-width="4" stroke-linecap="round"/>
      <text x="82" y="35" font-size="14" font-weight="800" fill="#22211f">ACTIVE VOCABULARY</text>
      <text x="82" y="57" font-size="12" fill="#6d6860">从查词继续走到主动表达</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="466" y="110" width="1010" height="596" rx="30" fill="#22211f"/>
      <rect x="484" y="128" width="974" height="560" rx="22" fill="#fffaf1"/>
      <rect x="484" y="128" width="188" height="560" rx="22" fill="#f0eee8"/>
      <rect x="672" y="128" width="786" height="74" fill="#faf9f6"/>
      <circle cx="520" cy="162" r="12" fill="#2f9fb6"/>
      <text x="546" y="169" font-size="20" font-weight="800" fill="#22211f">LexiFlow</text>

      <rect x="705" y="149" width="515" height="34" rx="17" fill="#f0eee8"/>
      <text x="730" y="171" font-size="12" fill="#8a857d">Search words, phrases, or examples…</text>
      <rect x="1264" y="149" width="108" height="34" rx="17" fill="#edf6f7"/>
      <text x="1286" y="171" font-size="12" font-weight="700" fill="#2f9fb6">Ctrl + K</text>

      <g fill="#6d6860" font-size="14">
        <rect x="508" y="224" width="136" height="48" rx="14" fill="#dff4f6"/>
        <text x="548" y="254" fill="#2f9fb6" font-weight="800">Today</text>
        <text x="548" y="310">Library</text>
        <text x="548" y="364">Review</text>
        <text x="548" y="418">Settings</text>
      </g>
      <g fill="none" stroke="#6d6860" stroke-width="3" stroke-linecap="round">
        <rect x="522" y="240" width="14" height="14" rx="3"/>
        <path d="M523 296h14v14h-14zM523 350h14v14h-14zM530 404a7 7 0 1 0 0 14 7 7 0 0 0 0-14z"/>
      </g>

      <rect x="716" y="238" width="466" height="376" rx="22" fill="#f7f6f2" stroke="#22211f" stroke-opacity=".08"/>
      <rect x="748" y="266" width="120" height="30" rx="15" fill="#dff4f6"/>
      <text x="773" y="286" font-size="12" font-weight="800" fill="#2f9fb6">WORD OF TODAY</text>
      <text x="748" y="360" font-family="Georgia,serif" font-size="66" font-weight="700" fill="#22211f">grow</text>
      <text x="748" y="392" font-size="18" fill="#6d6860">/grəʊ/</text>
      <circle cx="884" cy="378" r="18" fill="#edf6f7"/>
      <path d="M877 378h6l6-6v12l-6-6h-6z" fill="#2f9fb6"/>
      <text x="748" y="440" font-size="16" fill="#22211f">v. 生长；成长；发展</text>
      <rect x="748" y="470" width="390" height="74" rx="18" fill="#fffaf1"/>
      <text x="772" y="500" font-size="14" fill="#6d6860">You grow by what you practice.</text>
      <text x="772" y="525" font-size="12" fill="#9a948b">Learner-owned expression first.</text>

      <text x="1210" y="248" font-size="14" font-weight="800" fill="#22211f">Related words</text>
      <g>
        <rect x="1208" y="270" width="202" height="94" rx="18" fill="#e6f5f2"/>
        <text x="1230" y="305" font-size="22" font-family="Georgia,serif" font-weight="700" fill="#22211f">growth</text>
        <text x="1230" y="334" font-size="12" fill="#6d6860">n. 成长；增长</text>
        <rect x="1208" y="382" width="202" height="94" rx="18" fill="#fde9e5"/>
        <text x="1230" y="417" font-size="22" font-family="Georgia,serif" font-weight="700" fill="#22211f">growing</text>
        <text x="1230" y="446" font-size="12" fill="#6d6860">adj. 不断发展的</text>
        <rect x="1208" y="494" width="202" height="94" rx="18" fill="#efe9f6"/>
        <text x="1230" y="529" font-size="22" font-family="Georgia,serif" font-weight="700" fill="#22211f">grow up</text>
        <text x="1230" y="558" font-size="12" fill="#6d6860">phr.v. 长大；成熟</text>
      </g>

      <path d="M444 708h1050l-74 48H518z" fill="#c7c4bd"/>
      <path d="M674 713h592l-34 18H708z" fill="#aaa69d"/>
    </g>

    <g transform="translate(84 736)">
      <g>
        <circle cx="54" cy="54" r="43" fill="#dff4f6"/>
        <circle cx="54" cy="54" r="13" fill="none" stroke="#2f9fb6" stroke-width="4"/>
        <path d="M64 64l13 13" stroke="#2f9fb6" stroke-width="4" stroke-linecap="round"/>
        <text x="28" y="116" font-size="13" font-weight="800" fill="#22211f">Select</text>
      </g>
      <g transform="translate(270)">
        <circle cx="54" cy="54" r="43" fill="#fde7e2"/>
        <path d="M44 45c0-14 20-14 20 0v20H44z" fill="none" stroke="#e66c65" stroke-width="4"/>
        <text x="16" y="116" font-size="13" font-weight="800" fill="#22211f">Memorize</text>
      </g>
      <g transform="translate(540)">
        <circle cx="54" cy="54" r="43" fill="#eee8f6"/>
        <rect x="38" y="38" width="32" height="28" rx="4" fill="none" stroke="#9b7eb5" stroke-width="4"/>
        <circle cx="61" cy="47" r="4" fill="#9b7eb5"/>
        <path d="M42 62l8-9 7 7 7-5 4 7" fill="none" stroke="#9b7eb5" stroke-width="3"/>
        <text x="16" y="116" font-size="13" font-weight="800" fill="#22211f">Visualize</text>
      </g>
      <g transform="translate(810)">
        <circle cx="54" cy="54" r="43" fill="#e6f5f2"/>
        <path d="M42 66l22-22 6 6-22 22-10 3z" fill="none" stroke="#2f9fb6" stroke-width="4"/>
        <text x="32" y="116" font-size="13" font-weight="800" fill="#22211f">Apply</text>
      </g>
      <g transform="translate(1080)">
        <circle cx="54" cy="54" r="43" fill="#e7eef8"/>
        <path d="M40 52a16 16 0 0 1 27-10M68 56a16 16 0 0 1-27 10" fill="none" stroke="#527dbb" stroke-width="4" stroke-linecap="round"/>
        <path d="M67 35v10H57M41 73V63h10" fill="none" stroke="#527dbb" stroke-width="4"/>
        <text x="28" y="116" font-size="13" font-weight="800" fill="#22211f">Review</text>
      </g>
      <g stroke="#b8b4ad" stroke-width="2" stroke-dasharray="5 8">
        <path d="M108 54h205M378 54h205M648 54h205M918 54h205"/>
      </g>
    </g>
  </g>
</svg>