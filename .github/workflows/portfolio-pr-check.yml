name: Portfolio pull request check

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/media/versionflow/**'
      - 'scripts/**'
      - 'docs/versionflow/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/portfolio-pr-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript validation
        run: pnpm run typecheck

      - name: Build for GitHub Pages
        run: pnpm run build:pages

      - name: Verify all four projects are present in published UI
        run: node scripts/verify-portfolio-projects.mjs

      - name: Validate seven VersionFlow runtime screenshot assets
        run: node scripts/verify-versionflow-evidence.mjs

      - name: Verify static entry and assets
        run: |
          test -s dist/index.html
          test -s dist/media/lexiflow-real-visualize-grow.png
          test -s dist/media/lexiflow-real-apply-checked.png

      - name: Guard all portfolio projects and no downloadable resume route
        run: |
          grep -q "id: 'news-demo'" src/data/portfolio.ts
          test ! -e dist/documents/resume.html
          if grep -R -E 'documents/resume\.html' dist --include='*.js' --include='*.html'; then
            echo "Unexpected public resume link in built site" >&2
            exit 1
          fi
